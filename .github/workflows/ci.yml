name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: software_agent_test
          POSTGRES_USER: software_agent_test
          POSTGRES_PASSWORD: software_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U software_agent_test -d software_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://software_agent_test:software_agent_test@127.0.0.1:5432/software_agent_test
      TEST_DATABASE_URL: postgresql+psycopg://software_agent_test:software_agent_test@127.0.0.1:5432/software_agent_test
      GROQ_API_KEY: ci-placeholder
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: openai/gpt-oss-120b
      APP_ENV: test
      DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run backend tests
        run: python -m pytest -q


  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
